[package]
name = "next-agent-design"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI Design Studio mechanics: design systems, <artifact> directions, self-critique, element-to-source mapping, style code-mods, HTML conversion, the loopback preview proxy"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The preview proxy's refusals, as fields only (ADR-0013). MIT.
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
