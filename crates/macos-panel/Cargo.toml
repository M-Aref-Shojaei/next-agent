[package]
name = "next-agent-macos-panel"
description = "macOS notch detection and panel-like window behaviour for the overlay (public AppKit APIs only)."
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSScreen", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

# Own lint table: this is the one crate that must dereference the raw NSWindow
# pointer Tauri hands out, so `unsafe` is denied by default and allowed on that
# single function (the workspace table forbids it everywhere else).
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
