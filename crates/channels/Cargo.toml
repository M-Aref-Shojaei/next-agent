[package]
name = "next-agent-channels"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
next-agent-core = { path = "../core" }
next-agent-permission-engine = { path = "../permission-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
getrandom = "0.2"
# Telegram adapter only (src/telegram/api.rs): the Bot API over HTTPS.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
