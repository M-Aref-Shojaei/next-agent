[package]
name = "next-agent-diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local diagnostics log: allowlisted, redacted JSON lines under <app data>/logs (ADR-0013)"

[lib]
path = "src/lib.rs"

[dependencies]
tracing = "0.1"
tracing-core = "0.1"
# Registry and Layer only: the JSON shape, the allowlist and the file roller
# are ours (crates/diagnostics/src). MIT.
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["registry", "std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
