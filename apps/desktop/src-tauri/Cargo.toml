[package]
name = "next-agent-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "next_agent_desktop"
path = "src/lib.rs"

[[bin]]
name = "next-agent-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
next-agent-core = { path = "../../../crates/core" }
next-agent-permission-engine = { path = "../../../crates/permission-engine" }
next-agent-process-manager = { path = "../../../crates/process-manager" }
next-agent-graph = { path = "../../../crates/graph" }
next-agent-channels = { path = "../../../crates/channels" }
tokio = { version = "1", features = ["sync", "macros"] }
# Island geometry ported from Coucou (all platforms) and the macOS NSPanel.
next-agent-macos-panel = { path = "../../../crates/macos-panel" }

[target.'cfg(target_os = "linux")'.dependencies]
# Overlay input region and window type (Tauri already links GTK 3).
gtk = "0.18"
# Overlay as a layer-shell surface on wlroots, KDE and COSMIC. Opt-in: it
# links libgtk-layer-shell, which the build machine and the system need.
gtk-layer-shell = { version = "0.8", optional = true, features = ["v0_6"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[features]
layer-shell = ["dep:gtk-layer-shell"]
