[package]
name = "next-agent-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "next_agent_desktop"
path = "src/lib.rs"

[[bin]]
name = "next-agent-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
next-agent-core = { path = "../../../crates/core" }
next-agent-permission-engine = { path = "../../../crates/permission-engine" }
next-agent-process-manager = { path = "../../../crates/process-manager" }
next-agent-graph = { path = "../../../crates/graph" }
tokio = { version = "1", features = ["sync", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
next-agent-macos-panel = { path = "../../../crates/macos-panel" }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
