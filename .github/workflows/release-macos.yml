name: Release macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS release validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/desktop
        run: pnpm build
      - working-directory: apps/desktop
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: next-agent-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/**
            apps/desktop/src-tauri/target/release/bundle/dmg/**
      - name: Publish macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Next Agent $GITHUB_REF_NAME" --generate-notes
          find apps/desktop/src-tauri/target/release/bundle -type f -print0 | xargs -0 -r gh release upload "$GITHUB_REF_NAME" --clobber
