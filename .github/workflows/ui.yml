# UI test pipeline for Next Agent.
# Runs Playwright tests on every PR and push to main.
# Results are uploaded as artifacts; the owner reviews them in docs/plan/UiTestResults.md.

name: UI Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CI: true

jobs:
  playwright:
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    name: Playwright tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js 22.6
        uses: actions/setup-node@v4
        with:
          node-version: 22.6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend for tests
        working-directory: apps/desktop
        run: pnpm build

      - name: Install Playwright browsers
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium

      - name: Run Playwright tests
        working-directory: apps/desktop
        run: pnpm exec playwright test --project=chromium

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.os }}
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
            apps/desktop/.playwright/

      - name: Update UiTestResults.md (manual step)
        run: |
          echo "Run completed on ${{ matrix.os }}" >> docs/plan/UiTestResults.md
          echo "Review the HTML report at https://github.com/M-Aref-Shojaei/next-agent/actions/runs/${{ github.run_id }}" >> docs/plan/UiTestResults.md
          echo "Add your approval/rejection decision in the table above." >> docs/plan/UiTestResults.md
