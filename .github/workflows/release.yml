name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            installers: target/release/bundle/dmg/*.dmg
          - platform: Linux
            runner: ubuntu-22.04
            installers: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - platform: Windows
            runner: windows-latest
            installers: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libssl-dev libasound2-dev \
            libgtk-layer-shell-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Read Rust channel
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify release version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const read = (path) => JSON.parse(readFileSync(path, "utf8"));
          const app = read("apps/desktop/package.json").version;
          const bundle = read("apps/desktop/src-tauri/tauri.conf.json").version;
          if (app !== bundle || process.env.GITHUB_REF_NAME !== `v${app}`) {
            throw new Error("The release tag must match both desktop versions.");
          }
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: next-agent-${{ matrix.platform }}
          path: ${{ matrix.installers }}
          if-no-files-found: error

  publish:
    name: Publish installers
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: next-agent-*
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for platform in macOS Linux Windows; do
            if [[ -z "$(find "dist/next-agent-$platform" -type f -print -quit)" ]]; then
              echo "Missing $platform installers."
              exit 1
            fi
          done
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(find dist -type f -print0)
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" == false ]]; then
            echo "Release $GITHUB_REF_NAME is already published."
            exit 0
          fi
          if [[ -z "$draft" ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "Next Agent $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
