name: Release Linux

on:
  workflow_dispatch:
  pull_request:
    branches: ["release/linux-*"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux release validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libasound2-dev libgtk-layer-shell-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/desktop
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: next-agent-linux
          path: target/release/bundle/**
          if-no-files-found: error
