# CI matrix for Next Agent (M1 Step 0).
#
# Runs the Rust and TypeScript checks on macOS, Windows and Linux.
# Node scripts are invoked directly (not via `make`) so the job works on
# Windows, where GNU make is not installed by default.
#
# Steps that depend on artifacts which do not exist yet are guarded:
#   - pnpm install / `pnpm -r check` run only when pnpm-lock.yaml exists.
#   - the Tauri debug build runs only when apps/desktop/src-tauri/tauri.conf.json
#     exists and a lockfile is present.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

defaults:
  run:
    # Git Bash on Windows, so one syntax works on every runner.
    shell: bash

jobs:
  check:
    name: shared codebase checks
    runs-on: ubuntu-22.04
    env:
      # Test binaries include Tauri and the vendored overlay. Bound linker load
      # on the hosted runner and avoid caching debug symbols and incremental data.
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libasound2-dev \
            libgtk-layer-shell-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Read Rust channel from rust-toolchain.toml
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store path
        if: hashFiles('pnpm-lock.yaml') != ''
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install JS dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Compile Rust tests
        timeout-minutes: 35
        run: cargo test --locked --workspace --all-targets --no-run

      - name: Run Rust tests
        timeout-minutes: 15
        run: cargo test --locked --workspace --all-targets -- --test-threads=1

      - name: TypeScript tests
        run: node scripts/test.mjs

      - name: Workspace checks (make check equivalent)
        run: |
          node scripts/check-workspace.mjs
          node scripts/check-rust-structure.mjs
          node scripts/check-policy-parity.mjs
          node scripts/check-boundaries.mjs
          node scripts/check-no-coucou-assets.mjs

      - name: pnpm -r check
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm -r check

  # Non-blocking for now. The desktop app does not yet have a Tauri config,
  # so this job skips its build step. Once the desktop session lands Tauri,
  # remove `continue-on-error` so the job becomes required.
  tauri-build:
    name: shared Tauri build check
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libasound2-dev \
            libgtk-layer-shell-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Read Rust channel from rust-toolchain.toml
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install JS dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: tauri build --debug
        if: hashFiles('pnpm-lock.yaml') != '' && hashFiles('apps/desktop/src-tauri/tauri.conf.json') != ''
        run: pnpm --dir apps/desktop tauri build --debug
